<div id="pdfPanel" aria-label="講義 PDF">
  <div id="pdfDrag" title="拖曳調整寬度"></div>
  <div class="pdfbar">
    <strong id="pdfTitle">講義</strong>
    <button type="button" id="pdfPrev" title="上一頁">‹</button>
    <button type="button" id="pdfNext" title="下一頁">›</button>
    <a id="pdfNewTab" href="#" target="_blank" rel="noopener" title="在新分頁開啟">↗</a>
    <button type="button" id="pdfClose" title="關閉">✕</button>
  </div>
  <iframe id="pdfFrame" title="講義 PDF"></iframe>
</div>
<script>
(function () {
  var panel = document.getElementById('pdfPanel'), frame = document.getElementById('pdfFrame');
  var cur = { file: '', page: 1 };
  function show(file, page) {
    cur.file = file; cur.page = page;
    var url = file + '#page=' + page;
    // 同一份 PDF 只改 #page 時 Safari 不會跳頁，先清空再載入
    if (frame.dataset.file === file) { frame.src = 'about:blank'; setTimeout(function () { frame.src = url; }, 30); }
    else { frame.src = url; frame.dataset.file = file; }
    document.getElementById('pdfTitle').textContent = '講義 p.' + page;
    document.getElementById('pdfNewTab').href = url;
    document.body.classList.add('pdf-open');
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a.pdf-link, a.pdf-open-link');
    if (!a || e.metaKey || e.ctrlKey) return;
    e.preventDefault();
    var m = a.getAttribute('href').match(/^(.*?)(?:#page=(\d+))?$/);
    show(m[1], parseInt(m[2] || '1', 10));
  });
  document.getElementById('pdfClose').onclick = function () { document.body.classList.remove('pdf-open'); };
  document.getElementById('pdfPrev').onclick = function () { if (cur.page > 1) show(cur.file, cur.page - 1); };
  document.getElementById('pdfNext').onclick = function () { show(cur.file, cur.page + 1); };
  var drag = document.getElementById('pdfDrag');
  drag.addEventListener('mousedown', function (e) {
    e.preventDefault(); document.body.classList.add('pdf-dragging');
    function mv(ev) { var w = Math.min(Math.max(window.innerWidth - ev.clientX, 320), window.innerWidth - 360); document.documentElement.style.setProperty('--pdfw', w + 'px'); }
    function up() { document.body.classList.remove('pdf-dragging'); removeEventListener('mousemove', mv); removeEventListener('mouseup', up);
      try { localStorage.setItem('pdfw', getComputedStyle(document.documentElement).getPropertyValue('--pdfw')); } catch (_) {} }
    addEventListener('mousemove', mv); addEventListener('mouseup', up);
  });
  try { var w = localStorage.getItem('pdfw'); if (w) document.documentElement.style.setProperty('--pdfw', w); } catch (_) {}
})();
</script>
